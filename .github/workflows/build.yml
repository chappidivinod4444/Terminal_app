name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Start a test SSH server
        run: |
          sudo apt-get install -y -qq openssh-server >/dev/null 2>&1 || true
          echo "$USER:test-pass-123" | sudo chpasswd
          mkdir -p ~/.ssh && chmod 700 ~/.ssh && touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          ssh-keygen -q -t ed25519 -N "secret-pass" -C imported -f /tmp/protected_key
          mkdir -p /tmp/sshd && ssh-keygen -q -t ed25519 -N "" -f /tmp/sshd/host_ed25519
          cat > /tmp/sshd/config <<CFG
          Port 2222
          ListenAddress 127.0.0.1
          HostKey /tmp/sshd/host_ed25519
          PasswordAuthentication yes
          KbdInteractiveAuthentication yes
          PubkeyAuthentication yes
          StrictModes no
          UsePAM yes
          PidFile /tmp/sshd/pid
          CFG
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -t -f /tmp/sshd/config
          sudo /usr/sbin/sshd -f /tmp/sshd/config
          sleep 1
          echo "SSH_TEST_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "SSH_TEST_PORT=2222" >> $GITHUB_ENV
          echo "SSH_TEST_USER=$USER" >> $GITHUB_ENV
          echo "SSH_TEST_PASSWORD=test-pass-123" >> $GITHUB_ENV
          echo "SSH_TEST_AUTHORIZED_KEYS=$HOME/.ssh/authorized_keys" >> $GITHUB_ENV
          echo "SSH_TEST_PROTECTED_KEY=/tmp/protected_key" >> $GITHUB_ENV

      - name: Test SSH logins against the real server
        run: gradle testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SshTerminal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SshTerminal-apk
          path: SshTerminal.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" SshTerminal.apk \
            --title "SSH Terminal build ${{ github.run_number }}" \
            --notes "Download SshTerminal.apk below and open it on your phone to install."
