<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #0B0F17; }
  #wrap { position: absolute; inset: 0; padding: 4px 2px 2px 6px; box-sizing: border-box; touch-action: none; }
  #term { width: 100%; height: 100%; }
  .xterm .xterm-viewport { overflow-y: hidden !important; }
  .xterm-helper-textarea { opacity: 0 !important; pointer-events: none !important; }
</style>
</head>
<body>
<div id="wrap"><div id="term"></div></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="addon-web-links.js"></script>
<script>
(function () {
  var B = window.Bridge;
  var fontSize = 14;
  try { fontSize = parseInt(B.initialFontSize(), 10) || 14; } catch (e) {}

  var term = new Terminal({
    fontFamily: 'ui-monospace, "Droid Sans Mono", "Roboto Mono", monospace',
    fontSize: fontSize,
    scrollback: 5000,
    cursorBlink: true,
    allowProposedApi: true,
    convertEol: false,
    macOptionIsMeta: true,
    theme: {
      background: '#0B0F17', foreground: '#E6EDF3', cursor: '#4ADE80', cursorAccent: '#0B0F17',
      selectionBackground: '#2F81F755',
      black: '#1F2430', red: '#FF6B6B', green: '#4ADE80', yellow: '#FACC15',
      blue: '#60A5FA', magenta: '#C084FC', cyan: '#22D3EE', white: '#D1D5DB',
      brightBlack: '#6B7280', brightRed: '#FF8A8A', brightGreen: '#86EFAC', brightYellow: '#FDE68A',
      brightBlue: '#93C5FD', brightMagenta: '#D8B4FE', brightCyan: '#67E8F9', brightWhite: '#FFFFFF'
    }
  });
  var fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  try {
    term.loadAddon(new WebLinksAddon.WebLinksAddon(function (ev, uri) { B.openLink(uri); }));
  } catch (e) {}
  term.open(document.getElementById('term'));

  // Replies the terminal itself generates (cursor reports, pasted text) go to the server.
  term.onData(function (d) { B.input(d); });
  term.onBinary(function (d) { B.binary(d); });
  term.onResize(function (s) { B.resize(s.cols, s.rows); });
  term.onTitleChange(function (t) { B.title(t || ''); });
  term.onBell(function () { B.bell(); });

  function refit() {
    try { fit.fit(); } catch (e) {}
    B.resize(term.cols, term.rows);
  }
  window.addEventListener('resize', function () { setTimeout(refit, 30); });

  // ---- output from the server (base64 so any bytes survive the bridge)
  window.w = function (b64) {
    var bin = atob(b64);
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    term.write(arr);
  };

  // ---- keys that depend on terminal mode
  window.arrow = function (d, mod) {
    var app = term.modes && term.modes.applicationCursorKeysMode;
    if (mod) { B.input('\x1b[1;' + mod + d); return; }
    B.input((app ? '\x1bO' : '\x1b[') + d);
  };
  window.pasteText = function (t) { term.paste(t); };
  window.setFont = function (n) {
    fontSize = Math.max(7, Math.min(32, n));
    term.options.fontSize = fontSize;
    refit();
    B.fontChanged(fontSize);
  };
  window.allText = function () {
    var b = term.buffer.active, out = [];
    for (var i = 0; i < b.length; i++) {
      var line = b.getLine(i);
      if (line) out.push(line.translateToString(true));
    }
    while (out.length && out[out.length - 1] === '') out.pop();
    return out.join('\n');
  };
  window.clearTerm = function () { term.clear(); };
  window.scrollBottom = function () { term.scrollToBottom(); };

  // ---- touch: drag to scroll, pinch to zoom, tap for keyboard
  var wrap = document.getElementById('wrap');
  var startY = 0, lastY = 0, startX = 0, startT = 0, moved = false, acc = 0;
  var pinchStart = 0, pinchFont = fontSize, pinching = false;

  function dist(t) {
    var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function cellH() {
    var el = document.querySelector('.xterm-rows');
    if (el && term.rows) return el.getBoundingClientRect().height / term.rows || 18;
    return fontSize * 1.2;
  }

  wrap.addEventListener('touchstart', function (e) {
    if (e.touches.length === 2) {
      pinching = true; pinchStart = dist(e.touches); pinchFont = fontSize; moved = true;
      return;
    }
    pinching = false; moved = false; acc = 0;
    startY = lastY = e.touches[0].clientY; startX = e.touches[0].clientX; startT = Date.now();
  }, { passive: false });

  wrap.addEventListener('touchmove', function (e) {
    e.preventDefault();
    if (pinching && e.touches.length === 2) {
      var f = Math.round(pinchFont * dist(e.touches) / pinchStart);
      if (f !== fontSize) window.setFont(f);
      return;
    }
    var y = e.touches[0].clientY;
    if (Math.abs(y - startY) > 8 || Math.abs(e.touches[0].clientX - startX) > 8) moved = true;
    acc += (lastY - y);
    lastY = y;
    var h = cellH();
    var lines = (acc / h) | 0;
    if (lines !== 0) {
      acc -= lines * h;
      if (term.buffer.active.type === 'alternate') {
        // In full-screen apps (vim, less, top) send arrow keys instead of scrolling.
        var n = Math.min(Math.abs(lines), 5);
        for (var i = 0; i < n; i++) window.arrow(lines > 0 ? 'B' : 'A');
      } else {
        term.scrollLines(lines);
      }
    }
  }, { passive: false });

  wrap.addEventListener('touchend', function (e) {
    if (pinching) { if (e.touches.length === 0) pinching = false; return; }
    if (!moved && Date.now() - startT < 400) B.tap();
  });

  setTimeout(function () { refit(); B.ready(); }, 50);
})();
</script>
</body>
</html>
